<!doctype html>
<html lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oinam’s Album</title>
<style>
	:root {
		--color-gray-100: oklch(96% 0% 90deg);
		--color-gray-200: oklch(92% 0% 90deg);
		--color-gray-300: oklch(87% 0% 90deg);
		--color-gray-600: oklch(37% 0% 90deg);
		--color-gray-700: oklch(27% 0% 90deg);
		--color-gray-800: oklch(20% 0% 90deg);
		--color-gray-900: oklch(17% 0% 90deg);

		--text-color: var(--color-gray-600);
		--link-color: var(--color-gray-600);
		--link-hover-color: var(--color-gray-800);

		--space: calc(1.618034 * 1rem);
		--space-small: calc(1.618034 * 0.3rem);

		--border-radius: 3px;
		--border-color: var(--color-gray-300);

		--img-height: 200px;
		--img-width: auto;
	}

	*,
	::before,
	::after {
	  box-sizing: border-box;
	}

	html {
	  margin: 0;
	  padding: 0;
	  height: 100%;

	  scroll-behavior: smooth;
	  scroll-padding-top: 0;

	  -webkit-font-smoothing: antialiased;
	  -moz-osx-font-smoothing: grayscale;
	}

	body {
		margin: var(--space) auto;
		padding: 0;

		width: 96%;
		max-width: 1600px;

		font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
		font-weight: 400;

		color: var(--text-color);
	}

	h1, h2 {
		margin: 0 0 var(--space-small) 0;
		padding: 0;
		font-weight: 400;
	}

	h1 {
		border-bottom: 1px solid var(--border-color);
		padding-inline: var(--space-small);
	}

	h2 {
		font-size: 1.2rem;
	}
	
	a {
		text-decoration: none;
		display: inline-block;
		padding: var(--space-small);

		border: 1px solid transparent;
		border-radius: var(--border-radius);

		color: var(--link-color);
	}

	a:hover, a:active {
		background: var(--color-gray-100);
		border: 1px solid var(--border-color);

		color: var(--link-hover-color);
	}

	ul {
		list-style: none;
		margin: 0;
		padding: 0;
	}
	li {
		list-style: none;
		margin: 0;
		padding: 0;
	}

	img {
		width: var(--img-width);
		height: var(--img-height);
	}
	
</style>
</head>
<body>

<h1>Oinam’s Album</h1>

<ul id="2026">

	<li id="1111-11-11-demo-album-title">
		<a href="">
			<h2>Demo Album Title (Jan 11, 1111)</h2>
			<img src="/albums/1111-11-11-demo-album-title/1.jpg">
			<img src="/albums/1111-11-11-demo-album-title/2.jpg">
			<img src="/albums/1111-11-11-demo-album-title/3.jpg">
			<img src="/albums/1111-11-11-demo-album-title/4.jpg">
		</a>
	</li>
	<li id="1111-11-11-demo-album-title">
		<a href="">
			<h2>Demo Album Title (Jan 11, 1111)</h2>
			<img src="/albums/1111-11-11-demo-album-title/5.jpg">
			<img src="/albums/1111-11-11-demo-album-title/6.jpg">
			<img src="/albums/1111-11-11-demo-album-title/7.jpg">
		</a>
	</li>
	<li id="section-3">
		<a href="">
			<h2>Demo Album Title (Jan 11, 1111)</h2>
			<img src="/albums/1111-11-11-demo-album-title/8.jpg">
			<img src="/albums/1111-11-11-demo-album-title/9.jpg">
		</a>
	</li>

</ul>

<script>
	// Open links in new tab
  document.querySelectorAll('a[href]').forEach(link => {
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
  });
</script>

</body>
</html>
